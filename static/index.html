<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puppeteer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/components.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="in">
    <a class="brand" href="/?view=runs" data-nav><i></i>Puppeteer</a>
    <nav class="pages" aria-label="Screens">
      <a href="/?view=runs" data-view="runs" data-nav>Runs</a>
      <a href="/" data-view="workspace" data-nav hidden>This run</a>
      <a href="/?view=compare" data-view="compare" data-nav>Compare</a>
    </nav>
    <div class="right">
      <button class="theme" type="button" id="theme" aria-label="Switch to the light theme"><svg class="i moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="moon">Dark</span><span class="sun">Light</span></button>
      <a class="btn primary sm" href="/?view=new" data-nav data-new-run><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New run</a>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- Deep links keep the old shape: '/?job=' + the run id (+ &step=prep|edit|world|generate|export) and '/?view=runs|compare|new'.
       Old URLs still work: view=quick and view=studio open the workspace (studio also opens Details on Stages), view=lab is Compare. -->
  <!-- Page notices (toasts): anything that is not the status of the run in the URL. -->
  <div id="notices" class="toasts" aria-live="polite"></div>
  <!-- Run banner: only ever a failure of the run named in the URL (the step rail carries the running state). -->
  <div id="job-banner" class="banner" role="status" hidden><span class="dot"></span><div class="body"><span data-text></span><span class="fix" data-fix hidden></span><div class="actions-inline" data-actions hidden></div></div></div>
  <div id="view"></div>
</main>
<footer>Puppeteer · motion control for your character. Every final keeps the whole original audio.</footer>

<!-- ============================================================ Details drawer (level 3, the same on every step and every Runs card) -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="details" role="dialog" aria-modal="true" aria-labelledby="details-title" aria-hidden="true">
  <div class="dh"><h2 id="details-title">Details</h2><button class="btn icon sm" type="button" id="details-close" aria-label="Close">×</button></div>
  <div class="tabs" role="tablist" aria-label="Details">
    <button type="button" role="tab" data-tab="run" class="on">Run</button>
    <button type="button" role="tab" data-tab="stages">Stages</button>
    <button type="button" role="tab" data-tab="reports">Reports &amp; log</button>
    <button type="button" role="tab" data-tab="costs">Costs</button>
  </div>
  <div class="dbody" data-body></div>
</aside>

<!-- ============================================================ New run (Quick start) -->
<template id="tpl-start">
  <section class="panel start" id="start">
    <div class="ph"><div><h2>New run</h2><p>Pick a preset, add the character, choose the clip. The free preset starts on its own; a paid one asks first.</p></div></div>
    <form data-form="start">
      <h4>Preset</h4>
      <div class="presets" data-presets></div>
      <h4 style="margin-top:4px">Characters <span class="muted" style="text-transform:none;letter-spacing:0">· optional now, needed for the draft</span></h4>
      <div class="split row" data-chars>
        <label class="upload" style="flex:1 1 220px"><img data-thumb alt="" hidden><span><strong>Character 1</strong><small data-filename>A picture, or a short video of the character</small></span><input type="file" name="char1" aria-label="Character 1" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm"></label>
        <label class="upload" style="flex:1 1 220px"><img data-thumb alt="" hidden><span><strong>Character 2</strong><small data-filename>A picture · optional</small></span><input type="file" name="char2" aria-label="Character 2" accept="image/png,image/jpeg,image/webp"></label>
      </div>
      <details class="more" data-remember="start-more"><summary>More options<span class="hint">subject, depth model, dialogue, method</span></summary>
        <div class="body">
          <label class="field">Subject to mask<input name="prompt" value="person"><span class="hint">Motion clip presets only. One short noun phrase, for example “person” or “man in a dark suit”. Comma-separated subjects run as separate mask jobs (each paid) and are combined.</span></label>
          <label class="field">Depth model<select name="provider"><option value="replicate">Depth Anything on Replicate</option><option value="huggingface">Video Depth Anything on Hugging Face (free quota)</option><option value="replicate-chenxwh">Depth Any Video on Replicate (alternate)</option></select></label>
          <label class="check"><input type="checkbox" name="clean_dialogue" value="true"> <span>Clean dialogue · isolate the voice before lip-sync <span class="muted">· paid</span></span></label>
          <label class="field">Prep method<select name="mode"><option value="">From the preset</option><option value="face_mesh">Face mesh only · free</option><option value="depth">Motion clip · paid</option><option value="depth_mesh">Motion clip + face mesh · paid</option></select><span class="hint">Overrides the preset's method. Motion clip: a depth map plus a mask of the person; the face mesh draws the facial motion on top.</span></label>
        </div>
      </details>
      <label class="upload big"><span class="icon"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0 5 5m-5-5-5 5M4 20h16"/></svg></span><span><strong data-clip-title>Choose the clip</strong><small data-filename>MP4 or MOV, someone talking, 5–30 seconds</small></span><input aria-label="The clip" required type="file" name="video" accept="video/*"></label>
      <div class="row" data-go-row hidden><button type="submit" class="primary" data-go>Prepare</button><span class="reason" data-cost-hint></span></div>
      <p class="reason" data-auto-hint></p>
    </form>
  </section>
</template>

<!-- ============================================================ Workspace head: back link, name, chip, spent, Compare, Details, step rail, status line -->
<template id="tpl-ws-head">
  <div class="ws-head">
    <div class="ws-title">
      <a class="btn ghost sm" href="/?view=runs" data-nav><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>All runs</a>
      <h1 data-name>Run</h1>
      <button type="button" class="btn ghost icon sm" data-rename aria-label="Rename this run" title="Rename"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16zM13 7l4 4"/></svg></button>
      <form class="rename-form" data-rename-form hidden><input name="name" maxlength="80" aria-label="Run name"><button type="submit" class="sm">Save</button><button type="button" class="ghost sm" data-cancel>Cancel</button></form>
      <span class="chip" data-state></span><span class="spent">Spent <b data-spent>$0.00</b></span>
      <div class="right"><button type="button" class="sm" data-compare>Compare</button><button type="button" class="sm" data-details><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Details</button></div>
    </div>
    <nav class="rail-steps" aria-label="Steps" data-rail></nav>
    <div class="statusline" data-statusline><p data-status-text></p><span data-next></span></div>
  </div>
</template>

<!-- ============================================================ Prep (an existing run) -->
<template id="tpl-prep">
  <section class="panel" id="prep">
    <div class="prep-sum">
      <div class="thumb" data-thumb><span class="blank">No picture yet</span></div>
      <div class="prep-facts">
        <div class="row"><h3 data-title>Prepared clip</h3><span class="chip" data-chip></span></div>
        <p class="hint" data-method></p>
        <div data-progress hidden><div class="rail" data-stage-rail></div><p class="hint" data-progress-text></p></div>
        <p class="line" data-check hidden></p>
        <p class="line" data-face hidden></p>
        <p class="hint" data-background></p>
        <div class="prep-chars" data-chars></div>
        <div class="row" data-fix hidden></div>
      </div>
    </div>
    <details class="more" data-remember="prep-more"><summary>More<span class="hint">save as preset · new version from a stage</span></summary>
      <div class="body">
        <form data-form="preset" class="row">
          <label class="field" style="flex:1 1 180px">Preset name<input name="name" required placeholder="e.g. Studio talking head"></label>
          <label class="field" style="flex:2 1 240px">Description<input name="description" placeholder="One line: when to use it"></label>
          <button type="submit" class="sm">Save this recipe as a preset</button>
        </form>
        <p class="hint">A preset keeps this run's recipe (which stages ran, with which methods and settings) for the next New run. To change one stage and make a new version, open <button type="button" class="ghost sm" data-open-stages>Details · Stages</button>.</p>
      </div>
    </details>
  </section>
</template>

<!-- ============================================================ Edit: the timeline editor (tpl-editor mounts into [data-editor]) plus the approve bar -->
<template id="tpl-edit">
  <section id="edit" class="step-edit">
    <div class="empty" data-empty><p>The clip opens here when the preparation finishes.</p></div>
    <div data-ready hidden class="editor-host">
      <div data-editor></div>
      <div data-review-tools></div>
    </div>
  </section>
</template>

<!-- ============================================================ Timeline editor (static/editor.js) -->
<template id="tpl-editor">
  <div class="editor">
    <div class="viewer editor-viewer">
      <div class="views" data-tabs role="tablist" aria-label="View"></div>
      <div class="stage-view" data-stage></div>
      <div class="transport" data-transport></div>
      <div class="viewer-foot"><span class="hint" data-caption></span><details class="more inline" data-more-views data-remember="views-more" hidden><summary>More views</summary><div class="body row" data-more-tabs></div></details></div>
    </div>
    <div class="timeline-box" data-timeline></div>
    <div class="below">
      <div class="panel track-panel" data-track-panel></div>
      <div class="edit-side">
        <div class="savebar" data-savebar role="region" aria-label="Unsaved edits"></div>
        <div class="savebar" data-approvebar role="region" aria-label="Approval" hidden></div>
        <details class="more" data-remember="edit-downloads" data-downloads><summary>Downloads<span class="hint">this view · audio · files</span></summary><div class="body downloads" data-downloads-body></div></details>
      </div>
    </div>
  </div>
</template>

<!-- ============================================================ World & Look -->
<template id="tpl-world">
  <section class="world" id="world">
    <div class="slots3">
      <div class="slot" data-set><h4>Set <span class="muted" style="text-transform:none;letter-spacing:0">· the place</span></h4></div>
      <div class="slot" data-look><h4>Look <span class="muted" style="text-transform:none;letter-spacing:0">· the rendering style</span></h4></div>
      <div class="slot" data-light><h4>Light</h4><input name="light" placeholder="e.g. soft window light from the left, warm practicals" aria-label="Light"><div class="row"><button type="button" class="sm" data-describe>Describe the set and light from this frame</button><span class="reason" data-describe-hint></span></div><p class="line info" data-described hidden></p></div>
      <p class="hint" data-saved></p>
    </div>
    <div class="aside">
      <section class="panel" aria-label="Prompt">
        <div class="ph"><h3>Prompt</h3><span class="hint">what the generator will read</span></div>
        <pre class="prompt" data-prompt-preview>Building the prompt…</pre>
        <ul class="warnings" data-warnings hidden></ul>
        <details class="more" data-remember="prompt-edit"><summary>Edit prompt<span class="hint">text · spoken lines · references</span></summary>
          <div class="body">
            <textarea name="prompt" rows="7" aria-label="Prompt"></textarea>
            <div class="row"><button type="button" class="sm" data-build>Rebuild from set &amp; look</button><button type="button" class="sm" data-beats>Insert spoken lines</button></div>
            <p class="hint" data-beats-hint></p>
            <h4>References · attached in this order</h4>
            <div class="refs-strip" data-refs role="list" aria-label="Attached references"></div>
            <p class="hint" data-final-line></p>
            <p class="hint" data-task></p>
          </div>
        </details>
      </section>
    </div>
  </section>
</template>

<!-- ============================================================ Generate -->
<template id="tpl-generate">
  <section id="generate" class="step-generate">
    <div class="gen">
      <section class="panel" aria-label="Generate">
        <form data-form="seedance">
          <div class="ph"><h3>Generator</h3></div>
          <div data-generator></div>
          <select name="provider" aria-label="Generator" hidden></select>
          <div class="costline" data-costline></div>
          <h4 style="margin-top:8px">References</h4>
          <div class="refs" data-refs>
            <label class="ref upload" data-ref="char1"><img data-thumb alt="" hidden><i class="ph-ico" data-ico>1</i><b>Character 1 · @Image1</b><span data-filename>Choose a picture or a short video</span><input type="file" name="char1" aria-label="Character 1" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm"></label>
            <label class="ref upload" data-ref="char2"><img data-thumb alt="" hidden><i class="ph-ico" data-ico>2</i><b>Character 2 · @Image2</b><span data-filename>Optional · a picture</span><input type="file" name="char2" aria-label="Character 2" accept="image/png,image/jpeg,image/webp"></label>
            <div class="ref"><i>▶</i><b>Prepared clip · @Video1</b><span>motion, timing and lip-sync</span></div>
          </div>
          <textarea name="prompt" hidden aria-hidden="true"></textarea>
          <div class="row" style="margin-top:8px"><button type="submit" class="primary" data-draft-button disabled>Create draft</button><span class="reason" data-reason></span></div>
        </form>
      </section>
      <aside class="panel" aria-label="Prompt preview">
        <div class="ph"><h3>Prompt</h3><button type="button" class="ghost sm right" data-go="world">Edit in World &amp; Look</button></div>
        <pre class="prompt" data-prompt></pre>
      </aside>
    </div>
    <section class="panel draft" data-draft hidden>
      <div class="ph"><h3 data-draft-title>Draft</h3><span class="chip" data-quality></span></div>
      <video data-video controls playsinline preload="metadata"></video>
      <div class="row"><button type="button" class="primary" data-upgrade hidden>Make the final</button><button type="button" data-export-instead>Export instead <span class="cost">· free</span></button><a class="btn sm" data-download download>Download</a></div>
      <p class="reason" data-finalize-hint></p>
      <p class="line warn" data-finalize-warning hidden>The final will not be identical to the draft (a new render).</p>
      <p class="line" data-upgrade-status role="status" hidden></p>
    </section>
    <details class="more" data-remember="generate-more"><summary>More<span class="hint">a render made elsewhere · generator details · request files</span></summary>
      <div class="body">
        <h4>Add a render you made elsewhere</h4>
        <form data-form="finish" class="row"><label class="upload" style="flex:1 1 260px"><span><strong>Choose the rendered video</strong><small data-filename>The original audio is put back under it.</small></span><input name="video" aria-label="Rendered video" type="file" accept="video/*" required></label><button class="sm" type="submit">Add it · free</button></form>
        <h4>Generator details</h4>
        <p class="hint" data-provider-hint></p>
        <div data-sent hidden><h4>Submitted prompt &amp; request</h4><p class="hint" data-generation-id></p><pre class="prompt" data-sent-prompt></pre><div class="downloads" data-request-files></div></div>
      </div>
    </details>
  </section>
</template>

<!-- ============================================================ Export -->
<template id="tpl-export">
  <section class="export" id="export">
    <section class="panel">
      <div class="ph"><h3>Export</h3><span class="hint">a zip for the tool you take the files to · free, made on this computer</span></div>
      <div class="targets" data-targets role="radiogroup" aria-label="Export target"></div>
      <p class="line info" data-what>What's in it: …</p>
      <div class="row" data-formats></div>
      <p class="line" data-pending hidden></p>
      <details class="more" data-remember="export-files"><summary>Choose files<span class="hint" data-items-count></span></summary><div class="body"><div class="export-items" data-items></div></div></details>
      <div class="row"><button type="button" class="primary" data-export disabled>Export <span class="cost">· free</span></button><span class="reason" data-hint></span></div>
      <p class="line info" data-progress role="status" hidden></p>
      <div class="export-result" data-result hidden></div>
      <details class="more" data-earlier-box data-remember="export-earlier" hidden><summary>Earlier exports<span class="hint" data-earlier-count></span></summary><div class="body export-list" data-earlier></div></details>
    </section>
    <div class="aside" style="display:grid;gap:16px;align-content:start">
      <section class="panel subs" data-subs hidden><div class="ph"><h3>Subtitles</h3><span class="hint">burned into a copy of the final · free</span></div><div data-subs-body></div></section>
      <details class="more" data-remember="export-downloads"><summary>Downloads<span class="hint">single files of this run</span></summary><div class="body downloads" data-files></div></details>
    </div>
  </section>
</template>

<!-- ============================================================ Stage row (Details drawer · Stages; static/stagecard.js) -->
<template id="tpl-stage-card">
  <details class="stage">
    <summary><span class="n" data-index></span><span><span class="l" data-label></span><span class="m" data-summary></span></span><span class="chip" data-state></span></summary>
    <div class="stage-body">
      <div class="controls">
        <div class="row"><label class="field" style="flex:1 1 200px">Method<select data-tool></select></label><label class="toggle" data-toggle hidden><input type="checkbox" data-on> <span>on</span></label></div>
        <p class="hint" data-description></p>
        <div class="params" data-params></div>
        <p class="health" data-health></p>
        <div class="numbers" data-numbers></div>
        <ul class="warnings" data-warnings hidden></ul>
        <p class="line error" data-error hidden></p>
      </div>
      <div class="preview" data-preview></div>
      <div class="stage-foot"><span class="cost" data-cost></span><div class="row" data-fixes></div><button type="button" class="sm" data-rerun>Make a new version from here</button></div>
    </div>
  </details>
</template>

<!-- ============================================================ Runs -->
<template id="tpl-runs">
  <section id="runs" class="runs-page" style="display:grid;gap:24px">
    <div class="runs-head"><div class="lead"><h1>Your runs</h1><p>Every clip you have prepared, with its versions. Open one to keep working, or pick two to compare them side by side.</p></div><a class="btn primary" href="/?view=new" data-nav><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New run</a></div>
    <div class="tools">
      <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" data-search placeholder="Search runs" aria-label="Search runs"></label>
      <div class="filters" role="group" aria-label="Filter" data-filters></div>
      <label class="switch"><input type="checkbox" data-pick-mode><i></i>Pick to compare</label>
      <span class="hint" data-pick-count hidden></span>
      <a class="btn sm" data-open-compare data-nav hidden>Compare →</a>
      <a class="btn ghost sm" data-flat-toggle data-nav>List view</a>
    </div>
    <div class="grid" data-list></div>
    <div class="runs-foot" data-foot hidden><button type="button" data-more>Show more</button></div>
  </section>
</template>

<template id="tpl-run-card">
  <article class="card">
    <div class="thumb" data-thumb><label class="pick" data-pick hidden><input type="checkbox" aria-label="Pick to compare"></label><span class="chip state" data-state></span></div>
    <div class="cbody">
      <div class="name"><h3 data-name></h3><button type="button" class="btn ghost icon sm rename" data-rename aria-label="Rename" title="Rename"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16zM13 7l4 4"/></svg></button><form class="rename-form" data-rename-form hidden><input name="name" maxlength="80" aria-label="Run name"><button type="submit" class="sm">Save</button></form></div>
      <p class="hint" data-summary></p>
      <div class="msg" data-msg hidden></div>
      <div class="facts" data-facts></div>
      <div class="acts"><a class="btn primary sm" data-open data-nav>Open</a><button type="button" class="btn ghost sm" data-versions-toggle hidden></button><button type="button" class="btn ghost sm details" data-details>Details</button></div>
    </div>
    <details class="more versions" data-versions hidden><summary>Versions<span class="hint"></span></summary><div class="body" data-versions-body></div></details>
  </article>
</template>

<template id="tpl-version-row">
  <div class="branch">
    <div class="bt" data-thumb></div>
    <div><div class="bn"><b data-name></b><span class="chip" data-state></span></div><div class="bf" data-facts></div></div>
    <div class="acts"><a class="btn sm" data-open data-nav>Open</a><button type="button" class="btn ghost sm" data-details>Details</button><label class="check" data-pick hidden><input type="checkbox" aria-label="Pick to compare"></label></div>
  </div>
</template>

<!-- ============================================================ Compare -->
<template id="tpl-compare">
  <section class="panel compare" id="compare">
    <div class="ph"><h2>Compare</h2><span class="hint">two to four versions side by side, played in sync; your pick is remembered</span></div>
    <div class="pickers">
      <div><h4 style="margin-bottom:6px">Versions to compare <span data-count>(0 of 4)</span></h4><input type="search" data-search placeholder="Search runs" aria-label="Search runs" style="margin-bottom:8px"><div class="tray" data-tray></div></div>
      <div style="display:grid;gap:12px;align-content:start"><label class="field">View<select data-stage></select></label><label class="field">Note for your pick (optional)<input data-note placeholder="e.g. B keeps the hands"></label></div>
    </div>
    <div class="cmp-controls" data-controls hidden>
      <button type="button" class="sm primary" data-play>Play</button>
      <span class="seg-ctl" role="group" aria-label="Speed"><button type="button" class="on" data-speed="1">Normal</button><button type="button" data-speed="0.25">Slow ¼</button></span>
      <input type="range" min="0" max="1000" value="0" step="1" data-scrub aria-label="Position">
      <span class="time" data-time>0.00 / 0.00 s</span>
    </div>
    <div class="tiles" data-tiles></div>
    <div class="empty sm" data-empty>Choose at least two runs above.</div>
  </section>
</template>

<template id="tpl-compare-tile">
  <article class="tile">
    <div class="row"><span class="letter" data-letter>A</span><strong data-name class="wrap"></strong><span class="chip" data-state></span></div>
    <video data-video playsinline preload="metadata" muted></video>
    <div class="empty sm" data-missing hidden></div>
    <ul class="diff" data-diff></ul>
    <div class="numbers" data-numbers></div>
    <div class="row"><button type="button" class="sm" data-pick>Pick</button><span class="hint" data-picked hidden>Your pick</span><a class="btn sm" data-open data-nav>Continue with this version</a><button type="button" class="btn ghost sm" data-details>Details</button></div>
