<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puppeteer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
  <header class="top">
    <a class="brand" href="/" data-nav>Puppeteer <span class="eyebrow">/ motion control</span></a>
    <nav class="views" aria-label="Depth">
      <a href="/?view=quick" data-view="quick" data-nav>Quick</a>
      <a href="/?view=studio" data-view="studio" data-nav>Studio</a>
      <a href="/?view=lab" data-view="lab" data-nav>Lab</a>
      <a href="/?view=runs" data-view="runs" data-nav>Runs</a>
    </nav>
  </header>

  <!-- Deep links keep the old shape: '/?job=' + the run id (plus &view=quick|studio|lab) and '/?view=runs'. The app is in /static/app.js; styles in /static/app.css. -->
  <!-- Page notices: anything that is not the status of the job in the URL (upload failures, saved presets, network trouble). -->
  <div id="notices" class="notices" aria-live="polite"></div>

  <!-- Job banner: only ever the status of the job named in the URL. -->
  <div id="job-banner" class="status" role="status" hidden><span class="dot"></span><div class="body"><span data-text></span><span class="fix" data-fix hidden></span><div class="actions-inline" data-actions hidden></div></div></div>

  <div id="view"></div>

  <footer>Puppeteer · Original audio in your final export.</footer>
</main>

<!-- ============================================================ Quick -->
<template id="tpl-quick">
 <div>
  <div class="hero"><div><span class="eyebrow">Quick · upload, pick a preset, go</span><h1>Your performance.<br>Your character.</h1><p>Drive a character with a video you own: pick a preset, add the character reference, and go. You review the prepared clip next, then create the draft.</p></div></div>
  <section class="panel" id="source">
    <div class="heading"><span class="number">01</span><h2>Start with your video</h2></div>
    <form data-form="quick">
      <label class="upload"><span class="icon">↑</span><span><strong>Choose original video</strong><small data-filename>MP4 or MOV · up to 30 seconds</small></span><input aria-label="Original video" required type="file" name="video" accept="video/*"></label>
      <h3 style="margin-top:20px">Preset</h3>
      <div class="presets" data-presets></div>
      <div class="split" style="margin-top:18px">
        <label class="upload"><img data-thumb alt="Character 1 reference" hidden><span><strong>Character 1 · for the draft</strong><small data-filename>Image, or an identity video</small></span><input type="file" name="char1" aria-label="Character 1 reference" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm"></label>
        <label class="upload"><img data-thumb alt="Character 2 reference" hidden><span><strong>Character 2 · optional</strong><small data-filename>Image</small></span><input type="file" name="char2" aria-label="Character 2 reference" accept="image/png,image/jpeg,image/webp"></label>
      </div>
      <details><summary>More options</summary>
        <div class="split">
          <label class="field">Subject to replace<input name="prompt" value="person"><span class="hint">Depth presets only. One short noun phrase, e.g. “person” or “man in a dark suit”. Comma-separated subjects run as separate SAM jobs (each billed) and are combined.</span></label>
          <label class="field">Depth provider<select name="provider"><option value="replicate">Replicate · Depth Anything Video</option><option value="huggingface">Hugging Face · Video Depth Anything (free quota)</option><option value="replicate-chenxwh">Replicate · alternate model</option></select></label>
        </div>
        <label class="check" style="margin-top:14px"><input type="checkbox" name="clean_dialogue" value="true"> Clean dialogue (isolate vocals with Demucs before lip-sync; paid)</label>
      </details>
      <div class="actions"><span class="hint" data-cost-hint>The prepared clip carries the original audio. The final export always restores the entire original track.</span><button type="submit" data-go>Prepare →</button></div>
    </form>
  </section>
 </div>
</template>

<!-- ============================================================ Studio: new run with the legacy preparation method -->
<template id="tpl-studio-new">
  <section class="panel" id="studio-new">
    <div class="heading"><span class="number">+</span><h2>Prepare a new video</h2></div>
    <form data-form="legacy">
      <label class="upload"><span class="icon">↑</span><span><strong>Choose original video</strong><small data-filename>MP4 or MOV · up to 30 seconds</small></span><input aria-label="Original video" required type="file" name="video" accept="video/*"></label>
      <label class="field" style="margin-top:18px">Preparation method<select name="mode"><option value="depth">Advanced · Depth + SAM</option><option value="face_mesh">Fast · Face mesh (no depth or SAM)</option><option value="depth_mesh">Advanced + Face mesh · Depth + SAM + facial motion</option></select><span class="hint">Fast mode overlays facial motion on the original video and embeds the original audio; it needs face-mesh setup. Advanced + Face mesh adds facial motion over the depth composite and only warns about tracking gaps.</span></label>
      <details><summary>Preparation settings · depth modes only</summary>
        <div class="split">
          <label class="field">Subject to replace<input name="prompt" value="person"><span class="hint">One short noun phrase. Comma-separated subjects run as separate SAM jobs (each billed) and are combined.</span></label>
          <label class="field">Depth provider<select name="provider"><option value="replicate">Replicate · Depth Anything Video</option><option value="huggingface">Hugging Face · Video Depth Anything</option><option value="replicate-chenxwh">Replicate · alternate model</option></select></label>
        </div>
        <p class="hint">Depth colors are preserved. Preparation runs at 24 fps, up to 960 px. Media is uploaded to the selected providers.</p>
      </details>
      <label class="check" style="margin-top:14px"><input type="checkbox" name="clean_dialogue" value="true"> Clean dialogue (isolate vocals with Demucs before lip-sync)</label>
      <div class="actions"><span class="hint" data-cost-hint>The prepared clip carries the original audio by default.</span><button type="submit" data-go>Prepare video →</button></div>
    </form>
  </section>
</template>

<!-- ============================================================ Run header (Quick with a job, Studio) -->
<template id="tpl-run-head">
  <section class="panel run-head">
    <div class="title"><h2 data-title>Run</h2><span class="chip" data-state></span><span class="spent" data-spent>Spent so far: $0.00</span></div>
    <div class="facts"><span data-created></span><span data-mode></span><span data-parent hidden></span><span data-changed hidden></span><span class="mono" data-id></span></div>
    <div class="row" data-actions></div>
    <form data-form="preset" class="row" hidden style="margin-top:6px">
      <label class="field" style="flex:1 1 180px">Preset name<input name="name" required placeholder="e.g. Studio talking head"></label>
      <label class="field" style="flex:2 1 240px">Description<input name="description" placeholder="One line: when to use it"></label>
      <button type="submit" class="small">Save preset</button><button type="button" class="small secondary" data-cancel>Cancel</button>
    </form>
  </section>
</template>

<!-- ============================================================ Studio stage card -->
<template id="tpl-stage-card">
  <article class="card">
    <div class="card-head"><span class="number" data-index></span><h3 data-label></h3><span class="chip" data-state></span><label class="toggle" data-toggle hidden><input type="checkbox" data-on> <span>on</span></label></div>
    <div class="card-body">
      <div class="controls">
        <label class="field">Tool<select data-tool></select><span class="hint" data-description></span></label>
        <div class="params" data-params></div>
        <p class="health" data-health></p>
        <div class="numbers" data-numbers></div>
        <ul class="warnings" data-warnings hidden></ul>
        <div class="line error" data-error hidden></div>
      </div>
      <div class="preview" data-preview></div>
    </div>
    <div class="card-foot"><span class="cost" data-cost></span><div class="row" data-fixes></div><button type="button" class="secondary small" data-rerun>Re-run from here</button></div>
  </article>
</template>

<!-- ============================================================ Review panel (step 02). Agent 3: the mask wand goes into [data-review-tools]. -->
<template id="tpl-review">
  <section class="panel" id="review">
    <div class="heading"><span class="number">02</span><h2>Review the prepared input</h2></div>
    <p class="hint">Review the full mask or face-mesh tracking, and listen to the embedded audio before generating.</p>
    <div class="status" data-progress hidden><span class="dot"></span><div class="body"><span data-text></span><span class="fix" data-fix hidden></span><div class="actions-inline" data-actions hidden></div></div></div>
    <div class="empty" data-empty>Your original video and prepared previews will appear here.</div>
    <div data-ready hidden>
      <div class="tabs" data-tabs role="group" aria-label="Preview selection"></div>
      <div class="viewer"><video data-video controls playsinline preload="metadata"></video><div class="viewer-foot"><span class="hint" data-caption></span><a data-download download>Download video ↓</a></div></div>
      <div data-review-tools></div>
      <div class="review-box">
        <h3>Required · Review the complete input</h3>
        <p class="hint">Depth: check the entire mask for missing areas and background spill. Face mesh: check face tracking, eyes, mouth and alignment across every frame. Listen to the embedded audio.</p>
        <p class="line" data-review-status role="status"></p>
        <p class="line" data-tracking hidden></p>
        <label class="check"><input type="checkbox" data-check> I reviewed the entire prepared clip; its mask or face mesh is correctly aligned throughout.</label>
        <div class="row" style="margin-top:12px"><button type="button" data-approve disabled>Approve input</button><button type="button" class="secondary" data-reject>Input needs fixing</button></div>
      </div>
      <details><summary>Audio downloads</summary><div class="download" data-audio></div></details>
    </div>
  </section>
</template>

<!-- ============================================================ Draft panel (step 03) -->
<template id="tpl-draft">
  <section class="panel" id="draft">
    <div class="heading"><span class="number">03</span><h2>Create your draft</h2></div>
    <div class="meta"><span data-provider-label>Provider · …</span><span data-mode-label>Seedance · Edit</span><span data-draft-quality>Draft · …</span><span data-final-quality>Final · …</span></div>
    <form data-form="seedance">
      <div class="split">
        <label class="upload"><img data-thumb alt="Character 1 reference" hidden><span><strong>Character 1 · required</strong><small data-filename>Choose character reference</small></span><input type="file" name="char1" aria-label="Character 1 reference" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm"></label>
        <label class="upload"><img data-thumb alt="Character 2 reference" hidden><span><strong>Character 2 · optional</strong><small data-filename>Choose character reference</small></span><input type="file" name="char2" aria-label="Character 2 reference" accept="image/png,image/jpeg,image/webp"></label>
      </div>
      <label class="field" style="margin-top:20px">Seedance provider<select name="provider" aria-label="Seedance provider"></select><span class="hint" data-provider-hint>Loading providers…</span></label>
      <label class="field" style="margin-top:20px">Generation prompt<textarea name="prompt" required rows="7"></textarea></label>
      <div class="actions"><span class="hint">Review this prompt first. Full quality is a separate approval below.</span><button type="submit" data-draft-button disabled>Create draft →</button></div>
    </form>
  </section>
</template>

<!-- ============================================================ Final panel (step 04) -->
<template id="tpl-final">
  <section class="panel" id="final">
    <div class="heading"><span class="number">04</span><h2>Approve &amp; export</h2></div>
    <p class="hint">Every finished preview uses the entire original source audio, including voices and music.</p>
    <div class="empty" data-empty>Your draft will appear here when generation finishes.</div>
    <div data-ready hidden>
      <div class="viewer"><video data-video controls playsinline preload="metadata"></video><div class="viewer-foot"><span class="badge" data-quality>DRAFT PREVIEW</span><a data-download download>Download preview ↓</a></div></div>
      <div class="actions"><div><h3 style="margin-bottom:4px">Happy with this draft?</h3><span class="hint" data-finalize-hint>Approve it to generate the full-resolution version.</span><br><span class="hint" data-finalize-warning style="color:#d9a24a" hidden>Result will not be identical to the draft.</span></div><button type="button" data-upgrade disabled>Approve &amp; generate full resolution →</button></div>
      <div class="line" data-upgrade-status role="status" hidden></div>
    </div>
    <details data-sent hidden><summary>View submitted prompt &amp; generation ID</summary><p class="hint" data-generation-id></p><pre data-sent-prompt></pre><a data-raw-link class="hint">Download raw Seedance result</a></details>
    <details><summary>Import a generated result manually</summary>
      <form data-form="finish" style="margin-top:14px"><label class="upload"><span class="icon">↑</span><span><strong>Choose Seedance result</strong><small data-filename>We’ll restore the original source audio.</small></span><input name="video" aria-label="Seedance result" type="file" accept="video/*" required></label><div class="actions"><button class="secondary" type="submit">Restore original audio</button></div></form>
    </details>
  </section>
</template>

<!-- ============================================================ Lab -->
<template id="tpl-lab">
  <section class="panel" id="lab">
    <div class="heading"><span class="number">A/B</span><h2>Lab · compare runs side by side</h2></div>
    <p class="hint">Pick two to four runs or branches, choose which output to compare, and play them in sync. Your pick is saved per comparison.</p>
    <div class="split">
      <div><h3>Runs to compare <span class="hint" data-count>(0 of 4)</span></h3><div class="lab-picker" data-picker></div></div>
      <div><label class="field">Output to compare<select data-stage></select></label><label class="field" style="margin-top:12px">Note for your pick (optional)<input data-note placeholder="e.g. B keeps the hands"></label></div>
    </div>
    <div class="lab-controls" data-controls hidden>
      <button type="button" class="small" data-play>Play</button>
      <span class="row speed"><button type="button" class="small secondary active" data-speed="1">1×</button><button type="button" class="small secondary" data-speed="0.25">0.25×</button></span>
      <input type="range" min="0" max="1000" value="0" step="1" data-scrub aria-label="Position">
      <span class="time" data-time>0.00 / 0.00 s</span>
    </div>
    <div class="tiles" data-tiles></div>
    <div class="empty" data-empty>Choose at least two runs above.</div>
  </section>
</template>

<template id="tpl-lab-tile">
  <article class="tile">
    <div class="row"><span class="letter" data-letter>A</span><strong data-name class="wrap"></strong><span class="chip" data-state></span></div>
    <span class="mono" data-id></span>
    <video data-video playsinline preload="metadata" muted></video>
    <div class="empty" data-missing hidden></div>
    <ul class="diff" data-diff></ul>
    <div class="numbers" data-numbers></div>
    <div class="row"><button type="button" class="small secondary" data-pick>Pick this one</button><span class="hint" data-picked hidden>Your pick</span><a class="hint" data-open>Open in Studio</a></div>
  </article>
</template>

<!-- ============================================================ Runs page -->
<template id="tpl-runs">
  <section class="panel" id="runs">
    <div class="heading"><span class="number">≡</span><h2 data-title>Runs</h2></div>
    <div class="runs-tools"><label class="toggle"><input type="checkbox" data-flat> flat list</label><span class="hint">Every job under <code>runs/</code>. Branches sit under the run they were made from, newest roots first. Open a run in Studio, or add it to the Lab to compare.</span><a class="button small" data-open-lab hidden>Open Lab</a></div>
    <div class="runs" data-list></div>
  </section>
</template>

<template id="tpl-run-row">
  <div class="run-row">
    <span class="name"><span class="branch" data-branch hidden>└</span><a data-title data-nav></a> <span class="chip" data-state></span></span>
    <span class="when" data-when></span>
    <span class="detail" data-changed></span>
    <span class="links"><span class="cost" data-spent></span><a data-studio data-nav>Open in Studio</a><a data-quick data-nav>Quick view</a><button type="button" class="linkish small" data-lab>Add to Lab</button></span>
  </div>
</template>

<script type="module" src="/static/app.js"></script>
</body>
</html>
